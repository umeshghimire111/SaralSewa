

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/job_finder_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

freemarker:
  enabled: false

server:
  port: 8082

jwt:
  secret: DDFBMSDKcdvmm24302SMDVMFE24DGTIHI240RGKMOFRTHKORG$B*/9%$**@==+=

logging:
  pattern:
    console: "%clr(%6p) [ Saral sewa ]%clr(%m){ Blue }%n"
  level:
    root: INFO
    com.jobportal: DEBUG
    org.hibernate: ERROR
    tomcat: WARN

    spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  profiles:
    active: users

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml


